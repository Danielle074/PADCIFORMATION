# PADCI-WEB — Nginx sert la SPA buildée. Port non privilégié (8080) :
# le conteneur tourne en utilisateur non-root (voir Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets texte (JS/CSS/HTML générés par Vite).
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Assets hashés par Vite (ex. app.a1b2c3.js) : cache long, immuable.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routeur Vue (history mode) : toute route inconnue retombe sur
    # index.html, jamais mis en cache (sinon un déploiement reste bloqué
    # sur l'ancien bundle côté navigateur).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
